name: Feature request
description: Propose a new capability for the platform
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: A concrete description of the new capability and its contract.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design sketch
      description: |
        Interfaces, data flow, or a short example. The platform's seams are
        fixed (Provider, ToolPolicy, RetryPolicy, Evaluator, AuditLog) — show
        where the feature plugs in.
  - type: textarea
    id: tests
    attributes:
      label: Testing plan
      description: How will this be tested offline with a deterministic provider?
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Product tier
      options:
        - Free runtime
        - Hosted execution (Pro)
        - Team collaboration
        - Enterprise / compliance
        - Not sure yet
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I read CONTRIBUTING.md and ROADMAP.md
        - label: My proposal keeps zero runtime dependencies unless justified
